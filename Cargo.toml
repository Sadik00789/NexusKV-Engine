[package]
name = "nexuskv"
version = "0.1.0"
edition = "2024"
authors = ["NexusKV Engine Contributors"]
description = "Paged KV-Cache & Speculative Inference Engine"

[lib]
name = "nexuskv"
path = "src/lib.rs"

[[bin]]
name = "nexuskv"
path = "src/main.rs"

[features]
default = []
candle-model = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:tokenizers",
    "dep:half",
    "dep:bytemuck",
]
cuda = [
    "candle-model",
    "candle-core/cuda",
    "candle-nn/cuda",
]

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
futures-util = "0.3"
async-stream = "0.3"

# Real-model stack. Optional: the default build has no GPU, CUDA, or weights.
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
# default-features = false drops the C++ esaxx_fast path (whose crate hardcodes
# .static_crt(true) and breaks MSVC dynamic-CRT linking) and onig. Qwen uses a
# ByteLevel tokenizer and needs neither.
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["fancy-regex"] }
# f16 KV pools and dtype-aware tier serialization. Only the candle model path
# needs these; the default build stays dependency-light.
half = { version = "2.7", features = ["bytemuck"], optional = true }
bytemuck = { version = "1.25", optional = true }

[dev-dependencies]
criterion = "0.5"
proptest = "1.5"
reqwest = { version = "0.12", features = ["json", "stream"] }

[[bench]]
name = "bookkeeping"
harness = false

[build-dependencies]
cc = { version = "1.2", features = ["parallel"] }
