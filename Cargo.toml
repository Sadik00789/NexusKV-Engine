[package]
name = "nexuskv"
version = "0.1.0"
edition = "2024"
authors = ["NexusKV Engine Contributors"]
description = "Paged KV-Cache & Speculative Inference Engine"

[lib]
name = "nexuskv"
path = "src/lib.rs"

[[bin]]
name = "nexuskv"
path = "src/main.rs"

[features]
default = []
candle-model = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:tokenizers",
]
cuda = [
    "candle-model",
    "candle-core/cuda",
    "candle-nn/cuda",
]

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
futures-util = "0.3"
async-stream = "0.3"

# Real-model stack. Optional: the default build has no GPU, CUDA, or weights.
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
tokenizers = { version = "0.21", optional = true }

[dev-dependencies]
proptest = "1.5"
reqwest = { version = "0.12", features = ["json", "stream"] }

[build-dependencies]
cc = { version = "1.2", features = ["parallel"] }
